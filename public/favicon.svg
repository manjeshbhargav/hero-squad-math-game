<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000" />
  
  <defs>
    <!-- Premium Neon Glow filter for CRT style -->
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Centered Underlined Plus Symbol in CRT Cyan Color -->
  <g filter="url(#crt-glow)">
    <!-- Vertical bar of "+" -->
    <rect x="220" y="90" width="72" height="240" fill="#66fcf1" />
    <!-- Horizontal bar of "+" -->
    <rect x="136" y="174" width="240" height="72" fill="#66fcf1" />
    <!-- Underline -->
    <rect x="136" y="370" width="240" height="40" fill="#66fcf1" />
  </g>
</svg>