<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hero-squad-math-game/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Hero Squad!</title>
    <meta name="theme-color" content="#0b0c10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <script type="module" crossorigin src="/hero-squad-math-game/assets/index-DHGunz-E.js"></script>
    <link rel="stylesheet" crossorigin href="/hero-squad-math-game/assets/index-DvokGgq0.css">
  </head>
  <body class="bg-[#0b0c10] text-[#c5c6c7] font-sans antialiased overflow-x-hidden overflow-y-auto select-none">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then((reg) => {
              console.log('Service Worker registered successfully:', reg.scope);
              
              // Force-reload clients when a new service worker finishes installing
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed') {
                      if (navigator.serviceWorker.controller) {
                        console.log('[PWA] New content available! Reloading page...');
                        window.location.reload();
                      }
                    }
                  };
                }
              };
            })
            .catch((err) => console.warn('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
